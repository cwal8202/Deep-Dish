<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}푸드 트렌드 분석{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #fdfdfd;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar-brand img {
            height: 32px;
            margin-right: 8px;
        }

        .navbar .nav-link {
            color: #444;
            font-weight: 500;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #f78b00; /* 연주황 포인트 */
        }

        .card {
            border: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .btn-primary {
            background-color: #f78b00;
            border-color: #f78b00;
        }

        .btn-primary:hover {
            background-color: #e67a00;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='deep_dish_logo_cropped.png') }}"
                        alt="Deep-Dish Logo"
                        style="max-width: 200px; height: auto;">
                <!-- <strong>DEEP·DISH</strong> -->
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-4 d-flex align-items-center gap-4">
                    <li class="nav-item me-4">
                        <a class="nav-link {% if request.path == '/' %}active text-warning{% else %} {% endif %}" href="/">트렌드 분석</a>
                    </li>
                    <li class="nav-item me-4">
                        <a class="nav-link {% if request.path.startswith('/upload') %}active text-warning{% else %} {% endif %}" href="/upload">이미지 등록</a>
                    </li>
                    <li class="nav-item me-4">
                        <a class="nav-link {% if request.path.startswith('/result') %}active text-warning{% else %} {% endif %}" href="/menus_trend">음식 트랜드 분석</a>
                    </li>
                    <li class="nav-item me-4">
                        <a class="nav-link {% if request.path.startswith('/ingredients') %}active text-warning{% else %} {% endif %}" href="/ingredients_trend">재료 트랜드 분석</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/search') %}active text-warning{% else %} {% endif %}" href="/search">음식 검색</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
